# @format

name: Issue Workflow

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  triage:
    name: Issue Triage
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project board
        if: env.PROJECT_URL != ''
        uses: actions/add-to-project@v1
        env:
          PROJECT_URL: ${{ vars.PROJECT_URL }}
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
