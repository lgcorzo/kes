name: Go

on:
  pull_request:
    branches:
    - master
  push:
    branches:
    - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25.x
      id: go
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build and Lint
      run: |
         go build ./...
         go vet ./...
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
        id: go
      - name: Check out code
        uses: actions/checkout@v4
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          skip-config-verify: true
          args: --config ./.golangci.yml --timeout=5m
  test:
    name: Test ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25.x
      id: go
    - name: Check out code
      uses: actions/checkout@v4
    - name: Test
      env:
        GO111MODULE: on
      run: |
         go test ./...
  
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25.x
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Get govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      shell: bash
    - name: Run govulncheck
      run: govulncheck ./... || echo "::warning::govulncheck reported vulnerabilities in standard library or dependencies"
      continue-on-error: true
      shell: bash
